name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # v0.2.0 태그로 빌드하면 exe의 버전이 0.2.0이 된다.
      - name: Publish
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            dotnet publish -c Release -o publish -p:Version="${GITHUB_REF_NAME#v}"
          else
            dotnet publish -c Release -o publish
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Unmouse
          path: publish/Unmouse.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$GITHUB_REF_NAME" publish/Unmouse.exe --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
